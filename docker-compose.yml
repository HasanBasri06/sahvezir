# Sunucular (Laravel API) + MySQL. Client'lar Vercel'de olduğu için burada yok.
# Kullanım:  cp Docker/.env.example .env  (şifreleri doldur)  ->  docker compose up -d --build

# Proje adı sabit: klasör adı (servers) değişse de eski volume'lar (MySQL verisi, yüklemeler) kullanılmaya devam eder
name: sahvezir

x-laravel-common: &laravel-common
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+03:00
      - --max-connections=200
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD gerekli}
      BIMILYONCU_DB_DATABASE: ${BIMILYONCU_DB_DATABASE:-bimilyoncu}
      BIMILYONCU_DB_USERNAME: ${BIMILYONCU_DB_USERNAME:-bimilyoncu}
      BIMILYONCU_DB_PASSWORD: ${BIMILYONCU_DB_PASSWORD:?BIMILYONCU_DB_PASSWORD gerekli}
      LOGISTICS_DB_DATABASE: ${LOGISTICS_DB_DATABASE:-logistic}
      LOGISTICS_DB_USERNAME: ${LOGISTICS_DB_USERNAME:-logistics}
      LOGISTICS_DB_PASSWORD: ${LOGISTICS_DB_PASSWORD:?LOGISTICS_DB_PASSWORD gerekli}
      TZ: Europe/Istanbul
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Docker/mysql/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"   # sadece localhost'tan erişim (DBeaver/Workbench için)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------- bimilyoncu ----------------
  bimilyoncu-server:
    <<: *laravel-common
    image: bimilyoncu-server:latest
    container_name: bimilyoncu-server
    build: &bimilyoncu-build
      context: ./bimilyoncu
      dockerfile: ../Docker/bimilyoncu/Dockerfile
      additional_contexts:
        docker: ./Docker
    environment: &bimilyoncu-env
      CONTAINER_ROLE: app
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${BIMILYONCU_DB_DATABASE:-bimilyoncu}
      DB_USERNAME: ${BIMILYONCU_DB_USERNAME:-bimilyoncu}
      DB_PASSWORD: ${BIMILYONCU_DB_PASSWORD}
    volumes: &bimilyoncu-volumes
      - ./bimilyoncu/.env:/var/www/html/.env:ro
      - bimilyoncu_storage:/var/www/html/storage
    ports:
      - "${BIMILYONCU_PORT:-8001}:80"

  # QUEUE_CONNECTION=database olduğu için kuyruk işçisi
  bimilyoncu-queue:
    <<: *laravel-common
    image: bimilyoncu-server:latest
    container_name: bimilyoncu-queue
    build: *bimilyoncu-build
    environment:
      <<: *bimilyoncu-env
      CONTAINER_ROLE: worker
    volumes: *bimilyoncu-volumes
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3", "--max-time=3600"]

  # ---------------- logistics (TaşıBul) ----------------
  logistics-server:
    <<: *laravel-common
    image: logistics-server:latest
    container_name: logistics-server
    build: &logistics-build
      context: ./logistics
      dockerfile: ../Docker/logistics/Dockerfile
      additional_contexts:
        docker: ./Docker
    environment: &logistics-env
      CONTAINER_ROLE: app
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${LOGISTICS_DB_DATABASE:-logistic}
      DB_USERNAME: ${LOGISTICS_DB_USERNAME:-logistics}
      DB_PASSWORD: ${LOGISTICS_DB_PASSWORD}
    volumes: &logistics-volumes
      - ./logistics/.env:/var/www/html/.env:ro
      - logistics_storage:/var/www/html/storage
      # Uygulama yüklemeleri public/ altına yazıyor -> kalıcı volume (ilk açılışta imajdaki içerikle dolar)
      - logistics_assets:/var/www/html/public/assets
      - logistics_shipment_attachments:/var/www/html/public/shipment_attachments
      - logistics_verification:/var/www/html/public/verification
    ports:
      - "${LOGISTICS_PORT:-8002}:80"

  # routes/console.php içindeki Schedule (subscriptions:renew saatlik)
  logistics-scheduler:
    <<: *laravel-common
    image: logistics-server:latest
    container_name: logistics-scheduler
    build: *logistics-build
    environment:
      <<: *logistics-env
      CONTAINER_ROLE: scheduler
    volumes: *logistics-volumes
    command: ["php", "artisan", "schedule:work"]

  # Logistics şu an QUEUE_CONNECTION=sync. sqs/database'e geçersen:
  #   docker compose --profile logistics-queue up -d
  logistics-queue:
    <<: *laravel-common
    image: logistics-server:latest
    container_name: logistics-queue
    profiles: ["logistics-queue"]
    build: *logistics-build
    environment:
      <<: *logistics-env
      CONTAINER_ROLE: worker
    volumes: *logistics-volumes
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3", "--max-time=3600"]

volumes:
  mysql_data:
  bimilyoncu_storage:
  logistics_storage:
  logistics_assets:
  logistics_shipment_attachments:
  logistics_verification:
